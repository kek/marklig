[package]
name = "viewer"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
thiserror = "2"
notify = "6"
notify-debouncer-full = "0.3"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# OS-level recent-documents integration (NSDocumentController). Surfaces
# opened files in macOS surfaces like the Dock icon's right-click menu.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
