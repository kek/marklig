[package]
name = "marklig"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "marklig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
thiserror = "2"
chrono = "0.4"
marklig-sync-core = { path = "../crates/marklig-sync-core" }
snow = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "net", "rt", "io-util"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
base64 = "0.22"
local-ip-address = "0.6"

# Zero-config pairing discovery (`_marklig-sync._tcp`). Pure Rust — no
# Bonjour/Avahi system daemon to link against, unlike `zeroconf`/
# `astro-dnssd`, which matters for a self-contained Tauri bundle. Unlike
# `libmdns` (responder only) it does both halves: register the desktop's
# service and browse/resolve a peer's. `default-features = false` drops
# the async (flume/async) and log shims; the daemon runs on its own
# thread and we talk to it over blocking channels.
#
# Not in the desktop-only block below: the desktop announces, but the *phone*
# is what has to resolve — that is the whole point of announcing by name, and
# a dependency the mobile target does not get would make the discovery
# commands unregisterable there.
mdns-sd = { version = "0.20", default-features = false }

# Desktop-only filesystem watching + ignore-aware traversal. Android does
# not have a stable cross-OEM fs watcher, and the standalone mobile shell
# uses Storage Access Framework tree URIs rather than path walks. See the
# v2 mobile spec §5 (renderer reuse) for the split.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify = "6"
notify-debouncer-full = "0.3"
ignore = "0.4"
# Cross-platform "move to OS trash" with an unlink fallback in the command
# wrapper. macOS NSFileManager, Windows IFileOperation, freedesktop on Linux.
trash = "5"
# Embedded Typst compiler. Desktop-only — the mobile shells don't ship the
# preview pane wiring that would consume this.
typst = "0.14"
typst-syntax = "0.14"
typst-svg = "0.14"
typst-kit = "0.14"
comemo = "0.5"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# OS-level recent-documents integration (NSDocumentController). Surfaces
# opened files in macOS surfaces like the Dock icon's right-click menu.
# Also drives WKWebView.createPDF for native "Export as PDF…" (issue #55) —
# hence objc2-web-kit (WKWebView), objc2-core-foundation (CGRect), and block2
# (the createPDF completion block).
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
