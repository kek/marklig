[package]
name = "marklig"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"

[lib]
name = "marklig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
thiserror = "2"
chrono = "0.4"
marklig-sync-core = { path = "../crates/marklig-sync-core" }
snow = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "net", "rt", "io-util"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
base64 = "0.22"

# Desktop-only filesystem watching + ignore-aware traversal. Android does
# not have a stable cross-OEM fs watcher, and the standalone mobile shell
# uses Storage Access Framework tree URIs rather than path walks. See the
# v2 mobile spec §5 (renderer reuse) for the split.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify = "6"
notify-debouncer-full = "0.3"
ignore = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
# OS-level recent-documents integration (NSDocumentController). Surfaces
# opened files in macOS surfaces like the Dock icon's right-click menu.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
