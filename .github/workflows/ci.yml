name: CI

# `trunk`, not `main`: this repository has no `main` branch, so from the day
# this workflow was added until the day that was noticed it matched no event
# and produced zero runs — GitHub had not even registered it as a workflow.
# Every gate below, not just the Rust one, was decorative until this line.
on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]

jobs:
  # Frontend only. The Rust toolchain, the webkit build dependencies and the
  # `cargo check` step used to live here; they are now the `rust` job below, so
  # that a Rust regression is reported as a Rust failure and — the point — is
  # not silently skipped when an unrelated frontend step fails first. On the
  # very first run of this workflow that is exactly what happened: a Windows
  # vitest failure skipped every Rust step under it.
  unit:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Frontend type-check
        run: npx tsc -b --noEmit

      - name: Vitest
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Playwright e2e
        run: npm run test:e2e

  rust:
    name: Rust suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          # `-D warnings` — the action's own default, spelled out here so that
          # it reads as a decision rather than as something inherited. It was
          # briefly cleared: the first real run of this workflow died in
          # `cargo check` on Linux and macOS with 16 "errors" that were all
          # pre-existing dead-code and unused-import warnings, and unblocking
          # the Rust suite mattered more than a tree-wide cleanup. The cleanup
          # has since happened — the permanently-`Idle` `HandshakeStage`
          # machine, the phone-only half of `commands::mobile_sync` compiling
          # into desktop builds, an unused `SyncError` import — so the gate is
          # back on and holds the line from here.
          #
          # In practice this denies warnings in first-party code only: cargo
          # passes `--cap-lints allow` to registry dependencies, so a warning
          # in a crate we do not own cannot fail this job.
          rustflags: '-D warnings'

      # `cargo check` only proved the Rust compiled. Everything the Rust
      # actually promises lives in these tests, so these are the gate.
      #
      # `--workspace` deliberately: the old `cargo check` ran inside src-tauri
      # and so only ever saw the `marklig` package, which left the 34 tests in
      # `crates/marklig-sync-core` (envelope crypto, oplog, op resolution, the
      # pairing handshake and the QR codec) ungated too.
      #
      # `--no-fail-fast` so every test binary reports. Without it cargo stops
      # after the first failing target, which on the first Linux run meant one
      # unit-test failure hid the entire mdns and sync-core suites — a gate
      # that shows you one problem at a time is a gate you stop trusting.
      #
      # No separate `cargo check`: `cargo test` compiles the lib, the bins and
      # the test targets, so it strictly subsumes it. It is also strictly
      # stronger, and not theoretically: `cargo check` was green on Windows for
      # months while the lib test target did not compile there at all, because
      # `check` never builds test code.
      #
      # `tests/mdns_discovery.rs` binds real multicast sockets. It is run here
      # unconditionally and on purpose: whether a GitHub runner permits that is
      # a fact to be established, not guessed at, and those are the best tests
      # in the repository. Established: it does.
      - name: Cargo test
        run: cargo test --workspace --no-fail-fast

      # Deliberately a step of its own, and deliberately *after* the tests: the
      # rustc gate above must have already returned its verdict before clippy
      # gets an opinion, so that a clippy disagreement is legible as a clippy
      # disagreement and never mistaken for the compiler rejecting the tree.
      #
      # `-D warnings` reaches clippy's own lints through RUSTFLAGS, but it is
      # repeated after `--` so this step does not silently become advisory if
      # the toolchain block above is ever edited.
      #
      # `--all-targets` on purpose: clippy's most useful findings in this tree
      # were in test code.
      # `if: always()` so a red `cargo test` does not skip this and hide the
      # clippy verdict. The probe run lost the clippy result on both Linux and
      # Windows exactly that way — a step that only reports when everything
      # else already passed tells you least when you need it most.
      #
      # `toolchain: stable` floats, so a future clippy release can add a lint
      # and redden a PR that changed nothing. That is the same exposure
      # `-D warnings` already accepts for rustc above, and the same answer
      # applies: fix it or justify an `#[allow]` with a reason. The alternative
      # — advisory clippy — is what the rest of this file spent two commissions
      # learning not to ship.
      - name: Clippy
        if: always()
        run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

  build:
    name: Tauri build (${{ matrix.os }})
    needs: [unit, rust]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          # Same as the `rust` job. Kept identical on purpose: the release-shaped
          # build compiles code the `rust` job does not (the `marklig` binary
          # target, and whatever a `cfg` only turns on under a bundle), so a
          # warning can appear here and nowhere else.
          rustflags: '-D warnings'

      - run: npm ci

      - name: Tauri build (debug)
        run: npm run tauri:build -- --debug
        timeout-minutes: 30
